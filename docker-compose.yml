services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowly}
      POSTGRES_USER: ${POSTGRES_USER:-flowly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - flowly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowly} -d ${POSTGRES_DB:-flowly}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [flowly]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      FRONTEND_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/backups:/app/backups
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [flowly]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [flowly]

volumes:
  flowly_pgdata:

networks:
  flowly:
    driver: bridge
